name: Inspect LanXing TV language

on:
  push:
    paths:
      - '.github/workflows/inspect-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract source project
        run: |
          mkdir -p source
          unzip -q lanxing-tv-1.16.6-b292-json-playlist-agp891.zip -d source
          test -d source/lanxing-tv-1.16.6-b292/app/src

      - name: Inspect visible Chinese UI strings
        working-directory: source/lanxing-tv-1.16.6-b292
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("app/src/main")
          chinese = re.compile(r"[\u4e00-\u9fff]")
          print("=== STRINGS XML ===")
          for p in sorted((root / "res" / "values").glob("strings.xml")):
              print(p.read_text(encoding="utf-8"))
          print("=== KOTLIN / JAVA STRING LITERALS ===")
          literal = re.compile(r'["\']([^"\']*[\u4e00-\u9fff][^"\']*)["\']')
          total = 0
          for p in sorted((root / "java").rglob("*")):
              if not p.is_file() or p.suffix not in {".kt", ".java"}:
                  continue
              try:
                  lines = p.read_text(encoding="utf-8").splitlines()
              except Exception:
                  continue
              for n, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if stripped.startswith(("//", "/*", "*", "*/")):
                      continue
                  matches = literal.findall(line)
                  if matches:
                      print(f"{p}:{n}: {line.strip()[:700]}")
                      total += len(matches)
          print(f"CODE_STRING_LITERALS={total}")
          print("=== VISIBLE XML ATTRIBUTES ===")
          total = 0
          for folder in ["layout", "menu", "xml", "values"]:
              base = root / "res" / folder
              if not base.exists():
                  continue
              for p in sorted(base.rglob("*.xml")):
                  for n, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                      if chinese.search(line) and re.search(r'android:(text|hint|contentDescription|title|label)=', line):
                          print(f"{p}:{n}: {line.strip()[:700]}")
                          total += 1
          print(f"VISIBLE_XML_LINES={total}")
          print("=== APP CLASS ===")
          p = root / "java/com/cyj265/iptvplayer/App.kt"
          print(p.read_text(encoding="utf-8"))
          PY
