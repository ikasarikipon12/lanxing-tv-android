name: Build LanXing TV APK

on:
  push:
    paths:
      - 'lanxing-tv-1.16.6-b292-json-playlist-agp891.zip'
      - '.github/workflows/build-apk.yml'
      - 'scripts/localize_english.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 6 compatible APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Extract source project
        run: |
          test -f lanxing-tv-1.16.6-b292-json-playlist-agp891.zip
          mkdir -p source
          unzip -q lanxing-tv-1.16.6-b292-json-playlist-agp891.zip -d source
          test -f source/lanxing-tv-1.16.6-b292/build.gradle.kts
          test -f source/lanxing-tv-1.16.6-b292/gradlew
          chmod +x source/lanxing-tv-1.16.6-b292/gradlew

      - name: Apply English localization
        run: |
          python3 -m py_compile scripts/localize_english.py
          python3 scripts/localize_english.py

      - name: Prepare API 36 test build
        working-directory: source/lanxing-tv-1.16.6-b292
        run: |
          sed -i 's/id("com.android.application") version "8.9.1"/id("com.android.application") version "8.10.1"/' build.gradle.kts
          sed -i 's/versionCode = System.getenv("RUN_NUMBER")?.toIntOrNull() ?: 74/versionCode = 295/' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = '    buildTypes {\n        release {'
          new = '    buildTypes {\n        debug {\n            applicationIdSuffix = ".english"\n            versionNameSuffix = "-en"\n        }\n        release {'
          if old not in s:
              raise SystemExit("Could not locate buildTypes release block")
          p.write_text(s.replace(old, new, 1))
          Path("app/src/debug/res/values").mkdir(parents=True, exist_ok=True)
          Path("app/src/debug/res/values/strings.xml").write_text(
              '<resources>\n    <string name="app_name">LanXing TV English</string>\n</resources>\n'
          )
          PY
          grep 'com.android.application' build.gradle.kts
          grep 'versionCode' app/build.gradle.kts
          grep -A4 'buildTypes {' app/build.gradle.kts

      - name: Build debug APK
        working-directory: source/lanxing-tv-1.16.6-b292
        env:
          RUN_NUMBER: '295'
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanxing-tv-debug-apk
          path: source/lanxing-tv-1.16.6-b292/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
