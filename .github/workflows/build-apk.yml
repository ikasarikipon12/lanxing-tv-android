name: Build LanXing TV APK

on:
  push:
    paths:
      - 'lanxing-tv-1.16.6-b292-json-playlist-agp891.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 6 compatible APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Extract source project
        run: |
          test -f lanxing-tv-1.16.6-b292-json-playlist-agp891.zip
          mkdir -p source
          unzip -q lanxing-tv-1.16.6-b292-json-playlist-agp891.zip -d source
          test -f source/lanxing-tv-1.16.6-b292/build.gradle.kts
          test -f source/lanxing-tv-1.16.6-b292/gradlew
          chmod +x source/lanxing-tv-1.16.6-b292/gradlew

      - name: Align Android Gradle Plugin with API 36
        working-directory: source/lanxing-tv-1.16.6-b292
        run: |
          sed -i 's/id("com.android.application") version "8.9.1"/id("com.android.application") version "8.10.1"/' build.gradle.kts
          grep 'com.android.application' build.gradle.kts

      - name: Build debug APK
        working-directory: source/lanxing-tv-1.16.6-b292
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanxing-tv-debug-apk
          path: source/lanxing-tv-1.16.6-b292/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
