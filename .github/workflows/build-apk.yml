name: Build LanXing TV APK

on:
  push:
    paths:
      - 'lanxing-tv-1.16.6-b292-json-playlist-agp891.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 6 compatible APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Extract source project
        run: |
          test -f lanxing-tv-1.16.6-b292-json-playlist-agp891.zip
          mkdir -p source
          unzip -q lanxing-tv-1.16.6-b292-json-playlist-agp891.zip -d source
          test -f source/lanxing-tv-1.16.6-b292/build.gradle.kts
          test -f source/lanxing-tv-1.16.6-b292/gradlew
          chmod +x source/lanxing-tv-1.16.6-b292/gradlew

      - name: Inspect app language resources
        working-directory: source/lanxing-tv-1.16.6-b292
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("app/src")
          print("=== RESOURCE FILES ===")
          for p in sorted(root.rglob("strings.xml")):
              print(p)
          print("=== CHINESE TEXT IN RESOURCE XML ===")
          count = 0
          for p in sorted(root.rglob("*.xml")):
              try:
                  lines = p.read_text(encoding="utf-8").splitlines()
              except Exception:
                  continue
              for n, line in enumerate(lines, 1):
                  if re.search(r"[\\u4e00-\\u9fff]", line):
                      print(f"{p}:{n}: {line.strip()[:500]}")
                      count += 1
                      if count >= 300:
                          print("OUTPUT_LIMIT_REACHED")
                          raise SystemExit(0)
          print(f"RESOURCE_CHINESE_LINES={count}")
          print("=== LOCALE / LANGUAGE CODE REFERENCES ===")
          count = 0
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix not in {".kt", ".java", ".xml", ".properties"}:
                  continue
              try:
                  lines = p.read_text(encoding="utf-8").splitlines()
              except Exception:
                  continue
              for n, line in enumerate(lines, 1):
                  if re.search(r"Locale|language|locale|zh_CN|zh-rCN|values-zh", line, re.I):
                      print(f"{p}:{n}: {line.strip()[:400]}")
                      count += 1
                      if count >= 120:
                          print("OUTPUT_LIMIT_REACHED")
                          raise SystemExit(0)
          print(f"LOCALE_REFERENCE_LINES={count}")
          PY

      - name: Prepare API 36 test build
        working-directory: source/lanxing-tv-1.16.6-b292
        run: |
          sed -i 's/id("com.android.application") version "8.9.1"/id("com.android.application") version "8.10.1"/' build.gradle.kts
          sed -i 's/versionCode = System.getenv("RUN_NUMBER")?.toIntOrNull() ?: 74/versionCode = 293/' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = '    buildTypes {\n        release {'
          new = '    buildTypes {\n        debug {\n            applicationIdSuffix = ".test"\n            versionNameSuffix = "-test"\n        }\n        release {'
          if old not in s:
              raise SystemExit("Could not locate buildTypes release block")
          p.write_text(s.replace(old, new, 1))
          Path("app/src/debug/res/values").mkdir(parents=True, exist_ok=True)
          Path("app/src/debug/res/values/strings.xml").write_text(
              '<resources>\n    <string name="app_name">LanXing TV Test</string>\n</resources>\n'
          )
          PY
          grep 'com.android.application' build.gradle.kts
          grep 'versionCode' app/build.gradle.kts
          grep -A4 'buildTypes {' app/build.gradle.kts

      - name: Build debug APK
        working-directory: source/lanxing-tv-1.16.6-b292
        env:
          RUN_NUMBER: '293'
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanxing-tv-debug-apk
          path: source/lanxing-tv-1.16.6-b292/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
